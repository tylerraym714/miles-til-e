<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Miles Til E">
<title>Miles Til E</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f1624">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f6;--card:#fbfcfe;--ink:#17233d;--mute:#5d6b86;--line:#c9d2e2;--warn:#c43d24;--ok:#1f6b4f;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1624;--card:#17203a;--ink:#e6ebf7;--mute:#98a5c2;--line:#2b3757;--warn:#ff7a5c;--ok:#6fd1a5;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1624;--card:#17203a;--ink:#e6ebf7;--mute:#98a5c2;--line:#2b3757;--warn:#ff7a5c;--ok:#6fd1a5;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.4 Barlow,system-ui,sans-serif}
main{max-width:480px;margin:0 auto;padding:16px 16px 40px}
h1{font:700 22px/1 "Barlow Condensed",sans-serif;letter-spacing:.02em;margin:4px 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
label{display:block;font-size:14px;color:var(--mute);margin-bottom:4px}
input[type=number],input[type=text]{width:100%;font:600 20px Barlow,sans-serif;color:var(--ink);background:transparent;border:0;border-bottom:2px solid var(--line);padding:6px 0;border-radius:0}
input[type=number]:focus,input[type=text]:focus{outline:none;border-color:var(--ink)}
button{font:600 17px Barlow,sans-serif;color:var(--bg);background:var(--ink);border:0;border-radius:8px;padding:13px 16px;width:100%;margin-top:12px}
button.ghost{background:transparent;color:var(--mute);border:1px solid var(--line);font-size:15px;padding:9px}
button:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.big{font:700 76px/0.9 "Barlow Condensed",sans-serif}
.big small{font-size:26px;color:var(--mute);margin-left:6px}
.row{display:flex;gap:14px}.row>div{flex:1}
.gauge{position:relative;height:14px;margin:16px 0 4px;border-bottom:2px solid var(--ink)}
.gauge i{position:absolute;bottom:-2px;width:2px;height:14px;background:var(--ink)}
.needle{position:absolute;bottom:-2px;width:4px;height:22px;background:var(--warn);border-radius:2px;transform:translateX(-2px);transition:left .3s}
.ends{display:flex;justify-content:space-between;font:600 14px "Barlow Condensed",sans-serif;color:var(--mute)}
.by{font:700 34px/1 "Barlow Condensed",sans-serif}
.by.low{color:var(--warn)}
.note{font-size:14px;color:var(--mute);margin:8px 0 0}
.chk{display:flex;gap:10px;align-items:center;margin-top:14px;color:var(--ink);font-size:15px}
.chk input{width:22px;height:22px}
ul{list-style:none;margin:0;padding:0}
li{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
li span:last-child{color:var(--mute)}
select{flex:1;min-width:0;font:600 18px Barlow,sans-serif;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px}
.vrow{display:flex;gap:10px;align-items:stretch;margin-bottom:14px}
.vrow button{width:auto;margin:0;font-size:15px}
details summary{font-weight:600;padding:2px 0}
</style>
</head>
<body>
<main>
<h1 style="display:flex;align-items:center;gap:10px"><img src="icon-192.png" alt="" width="40" height="40" style="border-radius:9px">Miles til E</h1>

<div class="vrow"><select id="veh" aria-label="Vehicle"></select><button class="ghost" id="addv">Add vehicle</button><button class="ghost" id="joinv">Join</button></div>
<p class="note" id="sync" style="margin:-6px 0 12px"></p>

<section class="card" aria-live="polite">
<label for="cur">Odometer now</label>
<input id="cur" type="number" inputmode="numeric">
<button class="ghost" id="park" style="margin-top:10px">I’ve parked: save this odometer</button>
<p class="note" id="pmsg"></p>
<div style="margin-top:16px" class="big"><span id="gal">–</span><small>gal left</small></div>
<div class="gauge" id="g"><i style="left:0"></i><i style="left:50%"></i><i style="left:calc(100% - 2px)"></i><div class="needle" id="n" style="left:0"></div></div>
<div class="ends"><span>E</span><span>one tank</span></div>
<div class="row" style="margin-top:16px">
<div><label>Miles left</label><div class="by" id="mi">–</div></div>
<div><label>Refuel by odometer</label><div class="by" id="by">–</div></div>
</div>
<p class="note" id="msg"></p>
</section>

<section class="card">
<label for="fo">Odometer at fill-up</label>
<input id="fo" type="number" inputmode="numeric">
<div id="startwrap">
<label for="fs" style="margin-top:14px">Already in the tank (gallons)</label>
<input id="fs" type="number" inputmode="decimal" step="0.01" min="0">
<p class="note">Leave this at 0 if the tank was empty. Or check the box below if you filled to the top.</p>
</div>
<label for="fg" style="margin-top:14px">Gallons added</label>
<input id="fg" type="number" inputmode="decimal" step="0.01">
<label class="chk"><input id="ff" type="checkbox"> I filled one tank to the top</label>
<button id="add">Save fill-up</button>
<p class="note" id="fmsg"></p>
</section>

<section class="card">
<p class="note" id="cnt" style="margin:0 0 6px"></p>
<div style="max-height:420px;overflow-y:auto"><ul id="hist"></ul></div>
<button class="ghost" id="undo">Delete last entry</button>
<button class="ghost" id="reset" style="margin-top:8px">Clear all entries</button>
</section>

<section class="card">
<details><summary>Settings</summary>
<label for="s0" style="margin-top:12px">Vehicle name</label><input id="s0" type="text" maxlength="30">
<label for="s1" style="margin-top:12px">Miles per gallon</label><input id="s1" type="number" step="0.1">
<label for="s2" style="margin-top:12px">Refuel cushion (miles)</label><input id="s2" type="number">
<label for="s3" style="margin-top:12px">One tank holds (gallons)</label><input id="s3" type="number" step="0.1">
<p class="note" id="code"></p>
<button class="ghost" id="sharev" style="margin-top:12px">Share this vehicle</button>
<button class="ghost" id="sendv" style="margin-top:12px" hidden>Send share code</button>
<button class="ghost" id="unsharev" style="margin-top:12px" hidden>Stop sharing on this phone</button>
<label class="chk"><input id="auto" type="checkbox"> Auto-adjust mpg from my log</label>
<p class="note" id="cal"></p>
<button class="ghost" id="delv" style="margin-top:16px">Delete this vehicle</button>
<p class="note">Estimates only. On the first fill, say how much was already in the tank, or fill to the top. Check the gauge and leave a margin.</p>
</details>
</section>
</main>
<script src="sync.js"></script>
<script>
var K="f150fuel-v3";
function mk(n){return {id:"v"+Date.now()+Math.floor(Math.random()*1000),name:n,mpg:20,cushion:30,tank:15,log:[]}}
var DB=null;
try{DB=JSON.parse(localStorage.getItem(K)||"null")}catch(e){DB=null}
if(!DB||!Array.isArray(DB.v)||!DB.v.length){
 var old=null;try{old=JSON.parse(localStorage.getItem("f150fuel-v2")||"null")}catch(e){old=null}
 var v0=mk(old?"Vehicle 1":"My vehicle");
 if(old&&Array.isArray(old.log)){v0.mpg=old.mpg||v0.mpg;v0.cushion=old.cushion||v0.cushion;v0.tank=old.tank||v0.tank;v0.log=old.log}
 DB={v:[v0],a:v0.id}}
var S;
function pick(){S=DB.v.filter(function(x){return x.id===DB.a})[0]||DB.v[0];DB.a=S.id}
pick();
function save(){try{localStorage.setItem(K,JSON.stringify(DB))}catch(e){}}
function $(i){return document.getElementById(i)}
function last(){return S.log[S.log.length-1]}
function est(odo){var l=last();if(!l)return 0;var base=(typeof l.after==="number"&&isFinite(l.after))?l.after:l.gal;if(!l.odo)return Math.min(S.tank,base);return Math.max(0,Math.min(S.tank,base-(odo-l.odo)/S.mpg))}
function r1(x){return Math.round(x*10)/10}
function today(){var t=new Date();return (t.getMonth()+1)+"/"+t.getDate()+"/"+t.getFullYear()}
function fmtD(d){var p=String(d||"").split("/");if(p.length>=3&&String(p[2])===String(new Date().getFullYear()))return p[0]+"/"+p[1];return d||""}
function hasFill(){return S.log.some(function(e){return !e.park})}
function firstFillUI(){var show=!hasFill()&&!$("ff").checked;$("startwrap").hidden=!show;if(hasFill())$("fs").value=""}
function draw(){
 var odo=parseFloat($("cur").value);
 if(!last()){$("gal").textContent="–";$("mi").textContent="–";$("by").textContent="–";$("msg").textContent="Add your first fill-up below. Say how much was already in the tank, or fill to the top.";return}
 if(isNaN(odo)){odo=last().odo}
 var m=$("msg");
 if(odo<last().odo){$("gal").textContent="–";$("mi").textContent="–";$("by").textContent="–";m.textContent="That’s lower than your last entry ("+last().odo+").";return}
 var g=est(odo),mi=g*S.mpg,empty=odo+mi,by=Math.round(empty-S.cushion);
 $("gal").textContent=r1(g);
 $("mi").textContent=Math.round(mi);
 var b=$("by");b.textContent=by;b.className="by"+(odo>=by-10?" low":"");
 $("n").style.left=Math.min(100,g/S.tank*100)+"%";
 m.textContent=odo>=by?"Past your refuel-by number. Stop for fuel.":"Empty is near "+Math.round(empty)+". Last fill: "+last().odo+".";
}
function hist(){
 var h=$("hist");h.innerHTML="";
 var fills=0,parks=0,i;
 for(i=0;i<S.log.length;i++){if(S.log[i].park)parks++;else fills++}
 if(!S.log.length)$("cnt").textContent="No entries yet";
 else{var c=[];if(fills)c.push(fills+" fill-up"+(fills===1?"":"s"));if(parks)c.push(parks+" parked");$("cnt").textContent=c.join(" · ")+", newest first"}
 S.log.slice().reverse().forEach(function(e){
  var li=document.createElement("li");
  li.innerHTML="<span>"+fmtD(e.d)+" · "+(e.odo||"–")+"</span><span>"+(e.park?"parked":"+"+e.gal+" gal")+"</span>";
  h.appendChild(li)});
 firstFillUI();
}
function settings(){$("auto").checked=S.auto!==false;$("cal").textContent=S.calMsg||"";$("s0").value=S.name;$("s1").value=S.mpg;$("s2").value=S.cushion;$("s3").value=S.tank;shareUI()}
$("cur").addEventListener("input",draw);
$("ff").addEventListener("change",firstFillUI);
$("add").onclick=function(){
 var o=parseFloat($("fo").value),g=parseFloat($("fg").value),f=$("fmsg");
 if(isNaN(o)||isNaN(g)||g<=0){f.textContent="Enter the odometer and the gallons added.";return}
 if(last()&&o<last().odo){f.textContent="Odometer is lower than your last entry ("+last().odo+").";return}
 var first=!hasFill(),start=0;
 if(first){start=parseFloat($("fs").value);if(isNaN(start)||start<0)start=0;if(start>S.tank)start=S.tank}
 var before=first?start:est(o),after=$("ff").checked?S.tank:Math.min(S.tank,before+g);
 var e={id:newId(),t:Date.now(),full:$("ff").checked,d:today(),odo:o,gal:g,after:r1(after)};
 if(first&&!e.full&&start>0)e.a=r1(after);
 S.log.push(e);if(S.shared){rebuild(S);var vv=S;setTimeout(function(){sync(vv)},0)}calib(S);
 save();$("fo").value="";$("fg").value="";$("ff").checked=false;$("fs").value="";$("cur").value=o;
 f.textContent="Saved.";hist();settings();draw();
};
$("undo").onclick=function(){if(S.log.length>0){var x=S.log.pop();if(S.shared){if(x.id)S.dead[x.id]=1;rebuild(S);var vv2=S;setTimeout(function(){sync(vv2)},0)}calib(S);save();$("cur").value=last()?last().odo:"";hist();settings();draw();$("fmsg").textContent=""}};
$("reset").onclick=function(){if(S.shared){alert("This vehicle is shared, so clearing it would erase it for everyone. Use Delete last entry, or stop sharing first.");return}if(confirm("Clear every entry and start fresh?")){S.log=[];save();$("cur").value="";hist();draw();$("fmsg").textContent=""}};
[["s1","mpg"],["s2","cushion"],["s3","tank"]].forEach(function(p){
 $(p[0]).addEventListener("change",function(){var v=parseFloat(this.value);if(v>0){S[p[1]]=v;save();if(S.shared)pushMeta(S);draw()}})});
function calib(v){
 if(v.auto===false)return;
 var L=v.log;if(!L.length)return;
 var key=L.length+":"+L[L.length-1].odo;
 if(v.calKey===key)return;
 v.calKey=key;
 var e=[],carry=0;
 L.forEach(function(x){if(x.odo){e.push({o:x.odo,g:x.gal+carry});carry=0}else{carry+=x.gal}});
 var need=2*v.tank,gal=0,j=-1,i,n=0;
 for(i=e.length-1;i>=1;i--){gal+=e[i].g;if(e[i].g>0)n++;if(gal>=need&&n>=6){j=i-1;break}}
 if(j<0){var have=0;for(i=1;i<e.length;i++)have+=e[i].g;v.calMsg="MPG check needs about "+Math.round(need)+" gallons logged. You have "+Math.round(have)+".";return}
 var miles=e[e.length-1].o-e[j].o;
 if(miles<=0){v.calMsg="MPG check skipped: odometer readings don’t add up.";return}
 var m=miles/gal,nm=Math.round(Math.min(v.mpg*1.15,Math.max(v.mpg*0.85,m))*10)/10;
 v.calMsg="Last check: "+r1(m)+" mpg over "+miles+" miles and "+r1(gal)+" gallons. Now using "+nm+".";
 v.mpg=nm}
function vsel(){var s=$("veh");s.innerHTML="";DB.v.forEach(function(x){var o=document.createElement("option");o.value=x.id;o.textContent=x.name+(x.shared?" (shared)":"");if(x.id===DB.a)o.selected=true;s.appendChild(o)})}
function refresh(){vsel();$("cur").value=last()?last().odo:"";settings();$("fmsg").textContent="";hist();draw()}
$("veh").onchange=function(){DB.a=this.value;pick();save();refresh();sync(S)};
$("addv").onclick=function(){var n=prompt("Name for the new vehicle?");if(n&&n.trim()){var v=mk(n.trim().slice(0,30));DB.v.push(v);DB.a=v.id;pick();save();refresh()}};
$("s0").addEventListener("change",function(){var n=this.value.trim();if(n){S.name=n.slice(0,30);save();vsel();if(S.shared)pushMeta(S)}});
$("delv").onclick=function(){if(confirm("Delete "+S.name+(S.shared?" from this phone? The shared log stays online for others.":" and all its entries?"))){var id=S.id;DB.v=DB.v.filter(function(x){return x.id!==id});if(!DB.v.length)DB.v.push(mk("My vehicle"));DB.a=DB.v[0].id;pick();save();refresh()}};
DB.v.forEach(calib);save();wireSync();refresh();sync(S);
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(function(){})}
</script>
</body>
</html>
